<style>
:root{
  --navy:#0E2748; --navy2:#17375F; --navy-ink:#FFFFFF; --navy-sub:#B9C8DD;
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#F3F6FA; --ink:#0F1B2D; --muted:#5B6B80; --line:#DCE3EC;
  --accent:#1668E3; --accent-ink:#FFFFFF; --accent-soft:#E6F0FE;
  --crit:#E0342F; --crit-soft:#FDECEB; --warn:#EE8414; --warn-soft:#FFF2E3; --ok:#1C9A48; --ok-soft:#E5F5EB;
  --t-blue:#1E6FE8; --t-purple:#6B3FD8; --t-orange:#F08A18; --t-green:#1E9E4A; --t-grey:#5D6B80; --t-red:#E53935;
  --car-body:#F7F9FC; --car-line:#A3AFBF; --car-glass:#2A3A50;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06); --shadow-lg:0 12px 40px rgba(10,20,35,.22);
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:never-dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --navy:#08182D; --navy2:#10284A; --navy-sub:#9FB2CC;
    --bg:#0A1320; --surface:#132033; --surface2:#1A2A40; --ink:#E8EEF6; --muted:#93A3B8; --line:#24354C;
    --accent:#5B9BFF; --accent-ink:#06111F; --accent-soft:#16294A;
    --crit:#FF6B63; --crit-soft:#3A1A1B; --warn:#FFA54A; --warn-soft:#3A2710; --ok:#4FCB7C; --ok-soft:#12301F;
    --car-body:#E3E9F1; --car-line:#7F8DA0; --car-glass:#1B2738;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="never-dark"]{
  color-scheme:dark;
  --navy:#08182D; --navy2:#10284A; --navy-sub:#9FB2CC;
  --bg:#0A1320; --surface:#132033; --surface2:#1A2A40; --ink:#E8EEF6; --muted:#93A3B8; --line:#24354C;
  --accent:#5B9BFF; --accent-ink:#06111F; --accent-soft:#16294A;
  --crit:#FF6B63; --crit-soft:#3A1A1B; --warn:#FFA54A; --warn-soft:#3A2710; --ok:#4FCB7C; --ok-soft:#12301F;
  --car-body:#E3E9F1; --car-line:#7F8DA0; --car-glass:#1B2738;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* header */
.top{position:relative;z-index:5;background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:680px;margin:0 auto;padding:14px 16px 16px;display:flex;align-items:center;gap:12px;min-height:64px}
.greet{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.greet b{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.greet span{font-size:14px;color:var(--navy-sub)}
.bell{position:relative;border:0;background:none;color:inherit;padding:6px;cursor:pointer;border-radius:10px}
.bell .ic{width:28px;height:28px}
.bell i{position:absolute;top:0;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--t-red);color:#fff;font-style:normal;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy)}
.hdate{font-size:12px;color:var(--navy-sub);text-align:right;line-height:1.25}
.hback{border:0;background:none;color:inherit;padding:6px;margin-left:-6px;cursor:pointer;border-radius:10px;display:grid;place-items:center}
.htitle{flex:1;text-align:center;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hplus{width:34px;height:34px;border-radius:50%;border:0;background:var(--t-blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.hplus .ic{width:20px;height:20px;stroke-width:2.4}
.hspace{width:34px}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(15,27,45,.05)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"] svg{fill:var(--accent-soft)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--t-red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--t-blue);border-color:var(--t-blue);color:#fff}
.btn.go{background:var(--t-green);border-color:var(--t-green);color:#fff}
.btn.danger{background:var(--t-red);border-color:var(--t-red);color:#fff}
.btn.ghost{background:var(--surface2);border-color:var(--surface2)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{border:0;border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;box-shadow:var(--shadow)}
.kpi b{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;letter-spacing:-.02em;font-weight:600;opacity:.95;text-align:center;line-height:1.2}
.kpi.red{background:var(--t-red)} .kpi.orange{background:var(--t-orange)} .kpi.green{background:var(--t-green)}
.kpi.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)} .kpi.plain span{color:var(--muted)}

/* quick action tiles */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.qt{border:0;border-radius:14px;min-height:86px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:600;line-height:1.2;text-align:center;box-shadow:var(--shadow);position:relative}
.qt .ic{width:30px;height:30px;stroke-width:1.8}
.qt:hover{filter:brightness(1.06)}
.qa:not(.three) .qt{font-size:11px;padding:10px 2px;letter-spacing:-.02em;min-height:80px}
.qa:not(.three) .qt .ic{width:26px;height:26px}
.qt.blue{background:var(--t-blue)} .qt.purple{background:var(--t-purple)} .qt.orange{background:var(--t-orange)} .qt.green{background:var(--t-green)} .qt.grey{background:var(--t-grey)} .qt.red{background:var(--t-red)} .qt.navy{background:var(--navy2)}
.qt i{position:absolute;top:6px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--t-red);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
@media (max-width:380px){.qa{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* cards */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.mk-row{display:flex;gap:8px}.mk-row input{flex:1;font-size:20px;font-weight:700}.mk-row .btn{flex:none;padding:0 18px;min-height:46px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}

/* vehicle */
.carimg{width:110px;flex-shrink:0;display:block}
.carimg.lg{width:150px}
.vcard{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 12px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.vcard:hover{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.vcard .vi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vcard .vi b{font-size:17px;font-weight:700;line-height:1.2}
.vcard .reg{font-size:15.5px;font-weight:600}
.vcard .vd{font-size:13px;color:var(--muted)}
.vcard.off{opacity:.6}
.chev{color:var(--muted);width:20px;height:20px}
.status{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex-shrink:0}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.crit{color:var(--crit)} .status.off{color:var(--muted)}
.reg{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.odo{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.odo em{font-style:normal;font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.odo.sm{font-size:14px;font-weight:600}
.odo.sm em{font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.carlist{display:flex;flex-direction:column;gap:10px}

/* icon rows (tasks / alerts) */
.alerts{display:flex;flex-direction:column;gap:8px}
.irow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--surface);border:0;width:100%;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.irow.crit{background:linear-gradient(90deg,var(--crit-soft),var(--surface) 75%)}
.irow.warn{background:linear-gradient(90deg,var(--warn-soft),var(--surface) 75%)}
.isq{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.isq .ic{width:26px;height:26px}
.isq.red{background:var(--t-red)} .isq.orange{background:var(--t-orange)} .isq.green{background:var(--t-green)} .isq.blue{background:var(--t-blue)} .isq.grey{background:var(--t-grey)} .isq.purple{background:var(--t-purple)}
.irow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.irow .tx b{font-size:15px;font-weight:700;line-height:1.25}
.irow.crit .tx b{color:var(--crit)}
.irow .tx .s{font-size:13.5px;font-weight:600}
.irow.crit .tx .s{color:var(--crit)} .irow.warn .tx .s{color:var(--warn)} .irow.ok .tx .s{color:var(--ok)}
.irow .tx .d{font-size:12.5px;color:var(--muted)}

/* kv */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv div{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted);font-weight:500}
.kv b{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700}
.kv b.pos{color:var(--ok)} .kv b.neg{color:var(--crit)}

.info{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.info div{display:grid;grid-template-columns:44% 1fr;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.info div:last-child{border-bottom:0}
.info span{color:var(--muted)}
.info b{font-weight:600}

/* segmented tabs */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface2);border-radius:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid transparent;background:none;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow)}

.tablewrap{overflow-x:auto;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface2)}
td.r,th.r{text-align:right}
td.num{font-variant-numeric:tabular-nums}
td.wrapc{white-space:normal;min-width:160px}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface2)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.li:last-child{border-bottom:0}
button.li{width:100%;font:inherit;color:inherit;border-left:0;border-right:0;border-top:0;background:none;cursor:pointer;text-align:left;align-items:center}
.li .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.li .l b{font-weight:600}
.li .l span{font-size:12.5px;color:var(--muted)}
.li .r{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.date-h{padding:7px 14px;background:var(--surface2);font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.li.ua{align-items:center}
.li.staff{flex-direction:column;align-items:stretch;gap:10px}
.li.staff .srow{display:flex;align-items:center;gap:12px;min-width:0}
.li.staff .srow .l{flex:1;min-width:0}
.li.staff .sbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.li.staff .sbtns .btn{width:100%;padding:6px 4px}
.li.ua .l{flex:1}

.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
input[readonly]{background:var(--surface2)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(8,18,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:95%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
@media (min-width:700px){#sheet{align-items:center}.sheet-card{border-radius:20px;max-height:88%}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:var(--navy-ink)}
.sheet-head h2{flex:1;text-align:center}
.x{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.sheet-head::before{content:"";width:34px}
#sheetForm{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:14px;font-weight:600;color:var(--ink)}
.fld small{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
fieldset{border:0;border-radius:14px;padding:14px;margin:0;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
legend{float:left;width:100%;font-size:15px;font-weight:700;color:var(--ink);padding:0;margin-bottom:2px}
.check{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;min-height:0;flex-shrink:0;accent-color:var(--t-green)}
.calc{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 13px;font-weight:600;font-size:14px}
.calc .num{font-size:17px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.err{background:var(--crit-soft);color:var(--crit);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.sheet-actions{display:flex;flex-direction:column-reverse;gap:8px;position:sticky;bottom:-16px;background:var(--bg);padding:10px 0 16px;margin-bottom:-16px}
.sheet-actions .btn{width:100%}
.sheet-car{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.sheet-car .carimg{width:84px}
.sheet-car b{font-size:16px}
.photo{max-width:100%;border-radius:12px}
.udot{width:10px;height:10px;border-radius:50%;background:var(--t-blue);flex-shrink:0}
.greet .rl{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--navy-sub)}
.msg{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.msg p{white-space:pre-wrap}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:40px;background:linear-gradient(180deg,var(--navy) 0 260px,var(--bg) 260px)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.login-mark{display:flex;align-items:center;gap:14px;color:#fff}
.login-mark .logo{width:56px;height:56px;border-radius:14px;background:var(--t-blue);display:grid;place-items:center;flex-shrink:0}
.login-mark .logo .ic{width:32px;height:32px;color:#fff}
.login-mark h1{font-size:24px}
.login-mark p{color:var(--navy-sub);font-size:14px}

.session{background:var(--surface);border-radius:16px;box-shadow:0 0 0 2px var(--t-blue),var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.session .sh{display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:no-preference){#sheet .sheet-card{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}

/* --- телефон: без хоризонтално местене --- */
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{position:relative;touch-action:pan-y pinch-zoom}
/* iOS Safari разширява рамката (iframe) според съдържанието – това я държи в ширината на екрана */
@supports (-webkit-touch-callout:none){html{width:100%;overflow-x:hidden}body{width:1px!important;min-width:100%!important;max-width:100vw}}
.tabs,.top,#sheet{max-width:100vw}
#shell,#main,.wrap,.login,.login-card,#sheet,.sheet-card,#sheetForm{max-width:100%;overflow-x:hidden}
.wrap>*,.sec>*,.card>*,.panel>*,.grid2>*,.grid3>*,.filters>*,.fld,.kpis>*,.qa>*,.row>*{min-width:0}
input,select,textarea{min-width:0;max-width:100%}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.qt,.kpi span,.irow .tx b,.vcard .vi b,.li .l b,.greet b{overflow-wrap:anywhere}
.tablewrap,.chips{max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.top-in{max-width:100%}
img,svg{max-width:100%}

:root{color-scheme:light;--bg:#EAF0F7;--line:#DDE5EF;--shadow:0 1px 2px rgba(15,35,65,.06),0 6px 18px rgba(15,35,65,.08)}
html,body{background:#EAF0F7}
body{background:linear-gradient(180deg,#E4ECF6 0,#EEF3F9 320px,#F2F5FA 100%) fixed}
.top{background:linear-gradient(135deg,#0B2244 0%,#123463 60%,#1A4380 100%);box-shadow:0 6px 20px rgba(11,34,68,.25)}
.greet .rl{color:#9DB8E0}
.bell{background:rgba(255,255,255,.08);border-radius:14px}
.hplus{box-shadow:0 4px 12px rgba(30,111,232,.45)}
.qt,.kpi:not(.plain){background-image:linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.10) 100%);box-shadow:0 2px 3px rgba(15,35,65,.10),0 8px 18px -6px rgba(15,35,65,.35);border-radius:18px}
.qt{min-height:92px;gap:8px;font-size:13.5px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.15)}

.qa:not(.three) .qt .ic{width:30px;height:30px}
.qt:active,.kpi:active,.vcard:active,.irow:active{transform:scale(.97)}
.qt,.kpi,.vcard,.irow{transition:transform .12s ease}
.qt.blue{background-color:#1F6FEB}.qt.purple{background-color:#6A3FD6}.qt.orange{background-color:#F28A16}.qt.green{background-color:#1FA150}.qt.grey{background-color:#5E6E86}.qt.red{background-color:#E53935}.qt.navy{background-color:#16305C}
.kpi{border-radius:18px;padding:14px 6px 12px}
.kpi b{font-size:30px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.kpi.plain{background:#fff;border:0;box-shadow:var(--shadow)}
.kpi.plain b{color:#0F1B2D}
.card,.panel,.vcard,.list,.info,.tablewrap,.empty,.kv div,.msg,.irow,.session,fieldset,.check,.sheet-car{background:#fff;box-shadow:var(--shadow);border-radius:18px}
.vcard{padding:14px 14px 14px 10px}
.vcard .carimg{width:124px}
.isq{border-radius:14px;background-image:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,0) 50%,rgba(0,0,0,.08));box-shadow:0 4px 10px -4px rgba(15,35,65,.35)}
.isq .ic{fill:rgba(255,255,255,.28);stroke-width:2.1}
.irow.crit{background:linear-gradient(90deg,#FDEBEA,#fff 70%)}
.irow.warn{background:linear-gradient(90deg,#FFF1E1,#fff 70%)}
.tabs{background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid #E1E8F1}
.tab[aria-current="true"]{color:#1F6FEB}
.tab[aria-current="true"] svg{fill:rgba(31,111,235,.14)}
.login{background:linear-gradient(180deg,#0B2244 0,#123463 280px,#EAF0F7 280px)}
.login-mark .logo{background:linear-gradient(160deg,#3D8BFF,#1F6FEB);box-shadow:0 6px 16px rgba(31,111,235,.45)}
.carimg{filter:drop-shadow(0 3px 4px rgba(15,35,65,.12))}
.carphoto{object-fit:cover;border-radius:14px;aspect-ratio:3/2;height:auto;background:#fff;filter:none;box-shadow:0 1px 0 rgba(15,35,65,.05)}
.vcard .carphoto{width:124px}
.carimg.lg.carphoto{width:150px}
.phprev{width:100%;max-width:240px;aspect-ratio:3/2;object-fit:cover;border-radius:14px;display:block;background:#EEF2F6}
.fluid{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.fluid+.fluid{margin-top:10px}
.fl-h{display:flex;align-items:center;gap:12px}
.fl-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(15,35,65,.15)}
.fl-ic svg{width:30px;height:30px}
.fl-ic.oil{background:linear-gradient(145deg,#FFB547,#E07B00)}
.fl-ic.af{background:linear-gradient(145deg,#4FD1E8,#0E8FB0)}
.fl-ic.ty{background:linear-gradient(145deg,#5B9BFF,#1E5FD0)}
.fl-ic.lt{background:linear-gradient(145deg,#FFD84D,#E0A800)}
.lvl label[class^=lt-]{text-align:center}
.lvl label.lt-ok{--c:#1E9E4A}.lvl label.lt-bad{--c:#E5484D}.lvl label.lt-no{--c:#E08A00}
.lt-x{display:none;flex-direction:column;gap:10px}
.fluid:has(input[value=bad]:checked) .lt-x{display:flex}
.lt-q{font-size:13px;font-weight:600;color:var(--muted)}
.lt-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lt-list input{position:absolute;opacity:0;pointer-events:none}
.lt-list label{padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:#F6F8FB;text-align:center;font-weight:700;font-size:14px;color:#5D6B80;cursor:pointer}
.lt-list input:checked+label{border-color:#E5484D;color:#E5484D;background:#FDECEC;box-shadow:0 0 0 3px rgba(229,72,77,.15)}
.fluid:has(input[value=bad]:checked) .fl-warn{display:block}
.fluid .kv{margin:0}
.fl-h b{font-size:17px}.fl-h small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl input{position:absolute;opacity:0;pointer-events:none}
.lvl label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border-radius:12px;border:1.5px solid var(--line);background:#F6F8FB;font-weight:700;font-size:14px;cursor:pointer;color:#5D6B80}
.lvl .bar{width:22px;height:34px;border-radius:6px;border:2px solid currentColor;position:relative;overflow:hidden;opacity:.85}
.lvl .bar i{position:absolute;left:0;right:0;bottom:0;background:currentColor;opacity:.55}
.lvl label.min{--c:#E5484D}.lvl label.mid{--c:#E08A00}.lvl label.max{--c:#1E9E4A}
.lvl input:checked+label{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.fluid .check{box-shadow:none;background:#F6F8FB;padding:11px 12px}
.fl-warn{font-size:13px;font-weight:600;color:#E5484D;display:none}
.fluid:has(input[value=min]:checked) .fl-warn,.fluid:has(input[value=low]:checked) .fl-warn{display:block}
.ftsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ftsw input{position:absolute;opacity:0;pointer-events:none}
.ftsw label{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#F6F8FB;text-align:center;font-weight:700;font-size:16px;color:#5D6B80;cursor:pointer}
.ftsw input:checked+label{border-color:#1E6FE8;background:#EAF2FF;color:#1E6FE8;box-shadow:0 0 0 3px rgba(30,111,232,.15)}
.ftsw #ft_petrol:checked+label{border-color:#1E9E4A;background:#E8F7EE;color:#1E9E4A;box-shadow:0 0 0 3px rgba(30,158,74,.15)}
.ftpill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:2px;margin-left:4px;background:#EAF2FF;color:#1E6FE8}
.ftpill.petrol{background:#E8F7EE;color:#1E9E4A}
.sos{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#F0453F,#C62828);color:#fff;text-decoration:none;box-shadow:0 6px 16px rgba(198,40,40,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.sos.off{background:#EEF2F6;color:#5D6B80;box-shadow:none}
.sos-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.sos.off .sos-ic{background:#DDE3EA}
.sos-ic .ic{width:26px;height:26px;fill:rgba(255,255,255,.3);stroke-width:2.1}
.sos.off .sos-ic .ic{fill:none}
.sos-t{display:flex;flex-direction:column;gap:2px}.sos-t b{font-size:17px}.sos-t small{font-size:14px;opacity:.9;font-weight:600}
.lvl .q{width:22px;height:34px;display:grid;place-items:center;font-size:22px;font-weight:800;line-height:1}
.fl-warn2{font-size:13px;font-weight:600;color:#E08A00;display:none}
.fluid:has(input[value=no]:checked) .fl-warn2{display:block}
.shops{display:flex;flex-direction:column;gap:10px}
.shop{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.shop-h{display:flex;gap:12px;align-items:flex-start}
.shop-ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#FFB547,#E07B00);display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.shop-ic .ic{width:24px;height:24px;stroke:#fff;fill:rgba(255,255,255,.28)}
.shop-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}.shop-t b{font-size:16px}
.shop-t small{display:flex;gap:4px;align-items:flex-start;color:var(--muted);font-size:13.5px}.shop-t small .ic{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.shop-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shop-b .btn{justify-content:center;text-decoration:none;gap:6px}
.shop-b .btn:only-child{grid-column:1/-1}
.shop-b .btn .ic{width:18px;height:18px}
.tabs-in .tab{white-space:nowrap;min-width:0}
.tabs-in.six .tab{font-size:10.5px;letter-spacing:-.1px;padding-left:1px;padding-right:1px}
/* долна лента: залепена за дъното, страницата се превърта нормално */
#shell:not([hidden]){display:flex;flex-direction:column;min-height:100vh;min-height:100lvh}
#shell,#scroller{overflow:visible!important;overflow-x:clip!important}
body:not(.noscroll){overflow:visible!important;overflow-x:clip!important}
#scroller{flex:1 0 auto}
#shell>.tabs{position:sticky;bottom:0;left:auto;right:auto;flex:0 0 auto}
#scroller .wrap{padding-block:16px 24px}
.drvlist{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.li.idle{background:#F6F8FB}

/* ---- нова визия: цветни плочки с емоджи ---- */
.qa,.qa.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qt,.qa:not(.three) .qt{min-height:104px;padding:12px 12px 12px 14px;align-items:flex-start;justify-content:space-between;gap:6px;text-align:left;font-size:14px;letter-spacing:-.02em;font-weight:700;border-radius:20px;text-shadow:0 1px 2px rgba(0,0,0,.12);background-image:none;box-shadow:0 8px 18px -8px var(--qs,rgba(15,35,65,.4))}

.qt .ql{line-height:1.15;overflow-wrap:normal;word-break:normal;hyphens:manual;max-width:100%}

.qt.blue{background:linear-gradient(135deg,#62A6EC,#3E7ED6);--qs:rgba(62,126,214,.55)}
.qt.green{background:linear-gradient(135deg,#72C584,#4CA468);--qs:rgba(76,164,104,.55)}
.qt.purple{background:linear-gradient(135deg,#A084E6,#7456CC);--qs:rgba(116,86,204,.55)}
.qt.red{background:linear-gradient(135deg,#F2706A,#D8433F);--qs:rgba(216,67,63,.55)}
.qt.grey{background:linear-gradient(135deg,#F2BD55,#DE9A36);--qs:rgba(222,154,54,.55)}
.qt.navy{background:linear-gradient(135deg,#3E5C8C,#1F3660);--qs:rgba(31,54,96,.55)}
.qt i{top:10px;right:10px}
.kpi,.kpi:not(.plain){background:#fff!important;background-image:none!important;box-shadow:var(--shadow);border:1px solid #E6ECF3}
.kpi b{text-shadow:none}.kpi span{color:#5B6B80;font-size:11.5px;font-weight:500}
.kpi.red b{color:#E0342F}.kpi.orange b{color:#E4683A}.kpi.green b{color:#3E9A5A}.kpi.plain b{color:#0F1B2D}
.temo{font-size:25px;line-height:26px;height:26px;font-family:"Apple Color Emoji","Noto Color Emoji",sans-serif}
.tab{gap:2px;padding-top:8px;padding-bottom:9px}
.tab[aria-current="true"]{color:#E4683A}
.tab[aria-current="true"]::after{content:"";position:absolute;bottom:3px;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:2px;background:#E4683A}
.tab:not([aria-current="true"]) .temo{opacity:.85}
.greet b .gemo{font-family:"Apple Color Emoji","Noto Color Emoji",sans-serif;margin-right:6px}

.qt,.qa:not(.three) .qt{min-height:118px;padding:12px}

<script>
/* iPhone: рамката на Google не трябва да е по-широка от екрана */
(function(){
  var ios=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios)return;
  function fit(){
    var land=Math.abs(window.orientation||0)===90;
    var w=land?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    var st=document.getElementById('iosFit');
    if(!st){st=document.createElement('style');st.id='iosFit';document.head.appendChild(st)}
    st.textContent='html,body{width:'+w+'px!important;max-width:'+w+'px!important;min-width:0!important}html{overflow-x:hidden!important}body:not(.noscroll){overflow-x:clip!important}'+
      '#shell,#main,.wrap,.login,.login-card,.top,.tabs,#sheet,.sheet-card{max-width:'+w+'px!important}'+
      '.tabs,.top{width:'+w+'px!important}';
  }
  fit();window.addEventListener('orientationchange',function(){setTimeout(fit,200)});window.addEventListener('resize',fit);
})();

const API_URL='https://script.google.com/macros/s/AKfycbwqRZRiavSu2EORzG_kHWtKDJtGgIHxP51Fchagv1NC71JTDCwdKgwecgsexl0hW4aRgQ/exec';

<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);

const toTop=()=>{const sc=document.getElementById('scroller');if(sc)sc.scrollTop=0;window.scrollTo(0,0)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoD(new Date());
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fd=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}`:'—';
const fds=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}`:'—';
const fts=ts=>{if(!ts)return '';const d=new Date(ts);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fint=n=>(n==null||!isFinite(n))?'—':(n<0?'−':'')+Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fnum=(n,d=2)=>(n==null||!isFinite(n))?'—':(n<0?'−':'')+Math.abs(n).toFixed(d);
const eur=n=>(n==null||!isFinite(n))?'—':(n<0?'−':'')+'€'+Math.abs(n).toFixed(2);

/* Сутрешният километраж е НАЧАЛНИЯТ за деня. Изминатото за деня = следващият начален − този (минус отделните пътни записи между тях). */
function chainMorning(all){
  const by={};
  for(const e of all){if(e.t!=='trip'||e.del)continue;(by[e.carId]=by[e.carId]||[]).push(e)}
  for(const list of Object.values(by)){
    const mo=list.filter(e=>e.morning).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||'')||(a.endKm||0)-(b.endKm||0));
    const routes=list.filter(e=>!e.morning);
    mo.forEach((e,i)=>{const rd=+e.endKm||0,nx=mo[i+1];
      e.reading=rd;e.startKm=rd;
      if(nx){const nr=+nx.endKm||0;const inRoute=routes.filter(r=>(r.startKm??-1)>=rd&&(r.endKm??Infinity)<=nr).reduce((t,r)=>t+(r.km||0),0);
        e.endKm=nr;e.km=Math.max(0,nr-rd-inRoute);e.pending=false;
        /* дни без запис между двата начални километража: колата не е карана → 0 км */
        let d=addDays(e.date,1);let n=0;
        while(d<nx.date&&n<62){all.push({t:'trip',morning:true,idle:true,virtual:true,id:'v_'+e.id+'_'+d,carId:e.carId,date:d,driver:e.driver,road:e.road,startKm:nr,endKm:nr,reading:nr,km:0,pending:false});d=addDays(d,1);n++}}
      else{e.endKm=null;e.km=0;e.pending=true}});
  }
  all.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startKm??a.km??0)-(b.startKm??b.km??0)||(a.ts||'').localeCompare(b.ts||''));
}
function addDays(ds,k){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)}
function allEntriesRaw(){

    chainMorning(_EA);}
  return _EA;
}

function seasonFactor(car,date){
  const m=+String(date).slice(5,7),s=S.settings;
  if((s.winterMonths||[]).includes(m)){const p=(car.winterPct===''||car.winterPct==null)?s.winterPct:car.winterPct;return 1+(+p||0)/100}
  if((s.summerMonths||[]).includes(m))return 1+(+s.summerPct||0)/100;
  return 1;
}
function normRate(car,road,date){const n=car?.norms||{};const base=+n[road]||+n.mixed||0;return base*seasonFactor(car,date)}
const isBi=c=>/Бензин/.test(c?.fuel||'')&&/Газ|Метан/.test(c?.fuel||'');
const gasName=c=>/Метан/.test(c?.fuel||'')?'Метан':'Газ';
const ftOf=(c,e)=>isBi(c)?(e.ft==='petrol'?'petrol':'gas'):'main';
const ftLabel=(c,e)=>{const t=ftOf(c,e);return t==='petrol'?'Бензин':t==='gas'?gasName(c):''};
/* бензинът при газови коли се превръща в еквивалентни литри газ: газ/бензин по нормите (по подразбиране 1.2) */
const petrolRatio=c=>{const g=+(c?.norms?.mixed)||0,p=+(c?.nPetrol)||0;return g&&p?g/p:1.2};
const eqL=(c,e)=>ftOf(c,e)==='petrol'?(e.liters||0)*petrolRatio(c):(e.liters||0);
const tripNorm=(car,e)=>(e.km||0)*normRate(car,e.road||'mixed',e.date)/100;

function agg(list){
  const r={km:0,fuelL:0,fuelCost:0,normL:0,service:0,other:0,trips:0,fuels:0,gasL:0,petrolL:0,bi:false};
  for(const e of list){const car=S.cars[e.carId];
    if(e.t==='trip'){r.km+=e.km||0;r.normL+=tripNorm(car,e);if(!e.idle)r.trips++}
    else if(e.t==='fuel'){r.fuelL+=eqL(car,e);r.fuelCost+=e.sum||0;r.fuels++;const t=ftOf(car,e);if(t!=='main'){r.bi=true;r[t+'L']+=e.liters||0}}
    else if(e.t==='service'){r.service+=e.cost||0}
    else if(e.t==='expense'){r.other+=e.sum||0}}
  r.avgPrice=r.fuelL?r.fuelCost/r.fuelL:null;
  r.actual=r.km&&r.fuelL?r.fuelL/r.km*100:null;
  r.normRate=r.km?r.normL/r.km*100:null;
  r.econ=r.fuelL?r.normL-r.fuelL:null;
  r.econEur=r.econ!=null&&r.avgPrice!=null?r.econ*r.avgPrice:null;
  return r;
}
function tank(car){
  if(!car.tankCap||car.tankStart===''||car.tankStart==null)return null;
  const since=car.tankStartDate||'0000-00-00';let v=+car.tankStart;
  for(const e of entries()){if(e.carId!==car.id||e.date<since)continue;
    if(e.t==='fuel'){if(ftOf(car,e)!=='petrol')v+=e.liters||0}else if(e.t==='trip')v-=tripNorm(car,e);}
  return Math.max(0,Math.min(+car.tankCap,v));
}
function svcStatus(sv,odo){
  if(!sv||(sv.lastKm==null&&!sv.lastDate))return null;
  const s=S.settings,td=today();
  const nextKm=(sv.intKm&&sv.lastKm!=null)?+sv.lastKm+ +sv.intKm:null;
  const nextDate=(sv.intMonths&&sv.lastDate)?addMonths(sv.lastDate,sv.intMonths):null;
  const remKm=nextKm!=null?nextKm-(odo||0):null;
  const days=nextDate?daysBetween(td,nextDate):null;
  let lvl='ok';
  if((remKm!=null&&remKm<0)||(days!=null&&days<0))lvl='crit';
  else if((remKm!=null&&remKm<=s.serviceWarnKm)||(days!=null&&days<=s.warnDays))lvl='warn';
  return{nextKm,nextDate,remKm,days,lvl};
}
const tyreTarget=d=>{const m=+d.slice(5,7);return(m>=10||m<=3)?'winter':'summer'};
const lastOf=(carId,t)=>{const l=entries().filter(e=>e.carId===carId&&e.t===t);return l[l.length-1]||null};

function carAlerts(car){
  const out=[],s=S.settings,td=today(),odo=car.odo||0;
  if(car.active===false)return out;
  const docs=car.docs||{};
  const docList=[...DOCS.map(([k,l])=>({k,l,d:docs[k]})),...(docs.others||[]).filter(o=>o&&o.name&&o.until).map((o,i)=>({k:'other'+i,l:o.name,d:o.until}))];
  for(const{k,l,d}of docList){if(!d)continue;const left=daysBetween(td,d);
    if(left<0)out.push({lvl:'crit',kind:'doc',key:k,car,text:`${l}: изтекъл на ${fd(d)}`,sub:`Просрочен с ${-left} дни`});
    else if(left<=s.warnDays)out.push({lvl:'warn',kind:'doc',key:k,car,text:`${l}: изтича на ${fd(d)}`,sub:left===0?'Изтича днес':`След ${left} дни`});}
  for(const[k,l]of SVC){const st=svcStatus(svcOf(car,k),odo);if(!st||st.lvl==='ok')continue;
    const parts=[];if(st.remKm!=null)parts.push(st.remKm<0?`просрочен с ${fint(-st.remKm)} км`:`след ${fint(st.remKm)} км`);
    if(st.days!=null)parts.push(st.days<0?`просрочен от ${fd(st.nextDate)}`:`до ${fd(st.nextDate)}`);
    out.push({lvl:st.lvl,kind:'svc',key:k,car,text:`${l}${st.lvl==='crit'?': просрочен':''}`,sub:parts.join(' · ')});}
  const tgt=tyreTarget(td);
  const tm=+td.slice(5,7);
  if(car.tyreSeason!=='all'&&(car.tyreSeason?car.tyreSeason!==tgt:(tm===10||tm===4)))
    out.push({lvl:'warn',kind:'tyres',car,text:tgt==='winter'?'Смяна на гуми: летни → зимни':'Смяна на гуми: зимни → летни',sub:'Сезонно напомняне'});
  {const lc=lastOf(car.id,'check');const age=lc?daysBetween(lc.date,td):null;
    if(!lc||age>=s.pressureDays)out.push({lvl:'warn',kind:'pressure',car,text:'Периодична проверка: масло, антифриз, гуми, светлини',sub:lc?`Последна преди ${age} дни (${fd(lc.date)})`:'Още няма отбелязана проверка'});
    if(lc)for(const fk of['oil','af','ty']){const F=FLUIDS[fk],v=lc[F.k];if(!v)continue;
      const tu=entries().filter(e=>e.carId===car.id&&e.t==='topup'&&e.fluid===fk&&(e.date>lc.date||(e.date===lc.date&&(e.ts||'')>(lc.ts||'')))).pop();
      let vv=v,topped=!!lc[F.add]||!!tu;
      if(fk==='ty'&&tu&&tu.lvl){vv=tu.lvl;topped=!!tu.inflated}
      if(vv==='no')topped=false;
      const good=F.good.includes(vv),L=LVLCAP[vv],what=fk==='ty'?'налягане':'ниво';
      if(vv==='no'){
        if(isStaff())out.push({lvl:'warn',kind:'fluid',fluid:fk,key:F.k+':'+lc.id,car,text:'Гуми: не са проверени',sub:`Проверка на ${fd(lc.date)} от ${uname(lc.driver||lc.by)} – гумите са пропуснати`});
        else out.push({lvl:'warn',kind:'fluid',fluid:fk,tyNo:true,key:F.k+':'+lc.id,car,text:'Гуми: не са проверени – провери',sub:'Натисни тук, когато провериш гумите'});
        continue;}
      if(isStaff()){
        const lvl=(good||topped)?'good':(vv==='min'||vv==='low')?'crit':'warn';
        out.push({lvl,kind:'fluid',fluid:fk,key:F.k+':'+lc.id+(tu?':'+tu.id:''),car,text:good?`${F.name}: ${what} ${L}${vv==='mid'?' – в норма':''}`:topped?`${F.name}: ${F.topDone} (беше ${L})`:`${F.name}: ${what} ${L}`,
          sub:`${tu&&tu.lvl?'Гумите проверени на '+fd(tu.date)+' от '+uname(tu.driver||tu.by):'Проверка на '+fd(lc.date)+' от '+uname(lc.driver||lc.by)}${tu&&!tu.lvl?` · ${F.topDone} на ${fd(tu.date)} от ${uname(tu.driver||tu.by)}`:lc[F.add]?` · ${F.topDone} при проверката`:''}`});
      }else if(!good&&!topped)
        out.push({lvl:(vv==='min'||vv==='low')?'crit':'warn',kind:'fluid',fluid:fk,key:F.k+':'+lc.id,car,text:`${F.name}: ${what} ${L} – ${F.remind}`,sub:`Натисни тук, когато ${F.remind==='надуй'?'надуеш':'долееш'}`});
    }
    if(lc&&lc.ltLvl){
      const tu=entries().filter(e=>e.carId===car.id&&e.t==='topup'&&e.fluid==='lt'&&(e.date>lc.date||(e.date===lc.date&&(e.ts||'')>(lc.ts||'')))).pop();
      let v=lc.ltLvl,bad=lc.ltBad||[],fixed=!!lc.ltFix,src=lc;
      if(tu){if(tu.lvl){v=tu.lvl;bad=tu.ltBad||[];fixed=!!tu.fixed;src=tu}else fixed=true}
      const which=ltNames(bad),key='ltLvl:'+lc.id+(tu?':'+tu.id:''),who=`${fd(src.date)} от ${uname(src.driver||src.by)}`;
      if(v==='no'){
        if(isStaff())out.push({lvl:'warn',kind:'fluid',fluid:'lt',key,car,text:'Светлини: не са проверени',sub:`Проверка на ${who} – светлините са пропуснати`});
        else out.push({lvl:'warn',kind:'fluid',fluid:'lt',ltNo:true,key,car,text:'Светлини: не са проверени – провери',sub:'Натисни тук, когато провериш светлините'});
      }else if(isStaff())
        out.push({lvl:(v==='ok'||fixed)?'good':'crit',kind:'fluid',fluid:'lt',key,car,text:v==='ok'?'Светлини: всички светят':fixed?'Светлини: сменена крушка':'Светлини: изгоряла крушка',
          sub:`${which&&v!=='ok'?'Не светеше: '+which+' · ':''}Проверка на ${who}${tu&&!tu.lvl?` · сменена на ${fd(tu.date)} от ${uname(tu.driver||tu.by)}`:fixed?' · сменена при проверката':''}`});
      else if(v==='bad'&&!fixed)
        out.push({lvl:'crit',kind:'fluid',fluid:'lt',key,car,text:'Светлини: смени крушката',sub:`${which?'Не свети: '+which+' · ':''}Натисни тук, когато я смениш`});
    }}
  for(const p of Object.values(S.problems)){if(p.carId!==car.id||p.status==='resolved')continue;
    out.push({lvl:p.priority==='high'?'crit':'warn',kind:'problem',id:p.id,car,text:`Ремонт: ${p.cat}${p.desc?' – '+p.desc.slice(0,60):''}`,sub:`${PSTAT[p.status]||'Нов'} · сигнал от ${uname(p.by)} на ${fd(p.date)}`});}
  const RK={crit:0,warn:1,good:2};return out.sort((a,b)=>(RK[a.lvl]??1)-(RK[b.lvl]??1));
}

function dbMsg(err){const c=err?.code;
  if(c==='quota_exceeded')return 'Базата е пълна и не приема нови записи.';
  if(c==='revoked'||c==='not_granted')return 'Нямаш права за запис в тази книжка.';
  if(c==='invalid_argument')return 'Записът беше отказан. Може да нямаш права за редакция.';
  return err?.message&&!c?err.message:'Записът не мина. Провери връзката и опитай отново.';}
async function withRetry(fn){try{return await fn()}catch(e){if(e?.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));return await fn()}throw e}}
async function addEntry(carId,entry){
  entry.id=entry.id||uid();entry.ts=new Date().toISOString();entry.by=entry.by||meId;
  const month=entry.date.slice(0,7),ref=db.doc(`logs/${carId}_${month}`),body={e:{[entry.id]:clean(entry)}};
  try{await withRetry(()=>ref.update(body))}catch(err){
    if(err?.code!=='invalid_argument')throw err;
    const s=await ref.get();
    if(s.exists)await ref.update(body);else await ref.set({carId,month,...body});
  }
  return entry;
}
async function markEntry(carId,e,patch){await db.doc(`logs/${carId}_${e.date.slice(0,7)}`).update({e:{[e.id]:clean(patch)}})}
const carUpdate=(id,patch)=>withRetry(()=>db.doc('cars/'+id).update(clean(patch)));

const SHEET_EMO={'Сутрешен километраж':'🛣️','Пътен запис':'📝','Проблем':'⚠️','Сигнал за проблем':'⚠️','Периодична проверка':'🔍','Проверка на гумите':'🛞','Проверка на светлините':'💡','Сервиз':'🔧','Смяна на гуми':'🛞','Ще управлявам автомобил':'🔑','Документи':'📄','Нова задача':'📋','Ново съобщение':'💬','Настройки':'⚙️','Смяна на парола':'🔒','Друг разход':'💶','Нов автомобил':'🚗','Редактирай автомобил':'🚗','Сервизни интервали':'🗓️','Нов потребител':'👤','Редактирай потребител':'👤'};
function openSheet(title,html,onSubmit,label='Запази'){
  {const of=$('#sheetForm'),nf=of.cloneNode(false);of.parentNode.replaceChild(nf,of);nf.addEventListener('submit',onSheetSubmit)}
  const em=SHEET_EMO[title];$('#sheetTitle').innerHTML=(em?`<span class="shemo">${em}</span>`:'')+esc(title);
  $('#sheetForm').innerHTML=html+`<div class="err" id="formErr" hidden></div>`+
    (onSubmit?`<div class="sheet-actions"><button type="button" class="btn ghost" data-act="closeSheet">Отказ</button><button type="submit" class="btn go" id="sheetOk">${esc(label)}</button></div>`
             :`<div class="sheet-actions solo"><button type="button" class="btn" data-act="closeSheet">Затвори</button></div>`);
  sheetSubmit=onSubmit;$('#sheet').hidden=false;document.body.classList.add('noscroll');$('#sheetForm').scrollTop=0;
}
function closeSheet(){$('#sheet').hidden=true;sheetSubmit=null;document.body.classList.remove('noscroll');$('#sheetForm').innerHTML=''}
const onSheetSubmit=async ev=>{
  ev.preventDefault();if(!sheetSubmit)return;
  const form=ev.currentTarget,f={};
  for(const el of form.elements){if(!el.name)continue;if(el.type==='checkbox')f[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)f[el.name]=el.value;else if(!(el.name in f))f[el.name]=''}else if(el.type==='file')f[el.name]=el.files;else f[el.name]=el.value}
  const btn=$('#sheetOk'),err=$('#formErr');err.hidden=true;btn.disabled=true;
  try{const r=await sheetSubmit(f,form);if(r!==false)closeSheet()}
  catch(e){err.textContent=e?.code?dbMsg(e):(e?.message||dbMsg(e));err.hidden=false;err.scrollIntoView({block:'nearest'})}
  finally{if(btn)btn.disabled=false}
};
$('#sheetForm').addEventListener('submit',onSheetSubmit);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
const fail=m=>{throw new Error(m)};

function svcRow(c,k){const sv=svcOf(c,k),st=svcStatus(sv,c.odo);

  h+=`<div class="sec"><h3>Гуми и проверки</h3>${ty.length?`<div class="list">${ty.map(e=>`<div class="li"><div class="l"><b style="font-weight:500">${esc(entryText(e))}</b><span>${fd(e.date)} · ${esc(uname(e.driver||e.by))}</span></div></div>`).join('')}</div>`:'<div class="empty">Няма записи.</div>'}</div>`;
  const probs=Object.values(S.problems).filter(p=>p.carId===c.id&&p.date>=R.repFrom&&p.date<=R.repTo);
  h+=`<div class="sec"><h3>Проблеми</h3>${probs.length?`<div class="list">${probs.map(problemLi).join('')}</div>`:'<div class="empty">Няма сигнали.</div>'}</div>`;
  const tasks=Object.values(S.tasks).filter(t=>t.carId===c.id);
  h+=`<div class="sec"><h3>Задачи</h3>${alertList(carAlerts(c),true)}${tasks.length?`<div class="list">${tasks.map(t=>`<div class="li"><div class="l"><b>${esc(t.title)}</b><span>${t.due?'срок '+fd(t.due):''}</span></div><div class="r">${t.status==='done'?'<span class="pill ok">Изпълнена</span>':'<span class="pill warn">Отворена</span>'}</div></div>`).join('')}</div>`:''}</div>`;
  h+=`<div class="sec"><h3>История</h3>${histList(histItems(e=>e.carId===c.id&&e.date>=R.repFrom&&e.date<=R.repTo))}</div>`;
  return h;
}
function repDriver(){
  const opts=driverOpts(false);if(!opts.length)return '<div class="empty">Няма шофьори.</div>';
  if(!R.repDriver||!S.users[R.repDriver])R.repDriver=opts[0][0];
  const d=R.repDriver,ids=scopeIds();
  const E=entries().filter(e=>ids.has(e.carId)&&e.date>=R.repFrom&&e.date<=R.repTo);
  const trips=E.filter(e=>e.t==='trip'&&e.driver===d),fuel=E.filter(e=>e.t==='fuel'&&e.driver===d);
  const a=agg([...trips,...fuel]);
  const cars=[...new Set(trips.map(e=>e.carId))],days=new Set(trips.map(e=>e.date)).size;
  const byOthers=trips.filter(e=>e.by!==d).length;
  const probs=Object.values(S.problems).filter(p=>p.by===d&&p.date>=R.repFrom&&p.date<=R.repTo);
  const tdone=Object.values(S.tasks).filter(t=>t.doneBy===d&&t.doneTs&&t.doneTs.slice(0,10)>=R.repFrom&&t.doneTs.slice(0,10)<=R.repTo);
  const checks=E.filter(e=>e.t==='check'&&e.driver===d).length;
  let h=repPeriodFilters(`<label>Шофьор${rsel('repDriver',opts,d)}</label>`);
  h+=`<div class="panel"><h2>${esc(uname(d))}</h2><span class="small muted">${fd(R.repFrom)} – ${fd(R.repTo)} · ${ROLES[S.users[d]?.role]||''}${S.users[d]?.dept?' · '+esc(dname(S.users[d].dept)):''}</span>
  <div class="kv"><div><span>Автомобили</span><b>${cars.length}</b></div><div><span>Дни на управление</span><b>${days}</b></div><div><span>Километри</span><b>${fint(a.km)}</b></div><div><span>Зареждания</span><b>${a.fuels}</b></div><div><span>Проблеми</span><b>${probs.length}</b></div><div><span>Изпълнени задачи</span><b>${tdone.length+checks}</b></div></div>
  <p class="small muted">${cars.map(id=>esc(S.cars[id]?.reg||'')).join(', ')||'Няма управлявани автомобили'}${byOthers?` · ${byOthers} записа са въведени от друг потребител от негово име`:''}</p></div>`;
  h+=`<div class="sec"><h3>Гориво и разход</h3>${kvBlock(a,false)}</div>`;
  const rows=trips.map(e=>[fd(e.date),S.cars[e.carId]?.reg||'',{html:fint(e.startKm),csv:e.startKm},{html:fint(e.endKm),csv:e.endKm},{html:fint(e.km),csv:e.km},e.route||[e.from,e.to].filter(Boolean).join('–'),e.purpose||'',uname(e.by)]);
  h+=`<div class="sec"><h3>Маршрути</h3>${rows.length?tableHtml(['Дата','Автомобил','Начало','Край','Км','Маршрут','Цел','Въвел'],rows,null,[2,3,4]):'<div class="empty">Няма пътувания.</div>'}</div>`;
  if(fuel.length)h+=`<div class="sec"><h3>Зареждания</h3><div class="list">${fuel.map(fuelLi).join('')}</div></div>`;
  if(probs.length)h+=`<div class="sec"><h3>Проблеми</h3><div class="list">${probs.map(problemLi).join('')}</div></div>`;
  if(tdone.length)h+=`<div class="sec"><h3>Изпълнени задачи</h3><div class="list">${tdone.map(t=>`<div class="li"><div class="l"><b style="font-weight:500">${esc(t.title)}</b><span>${esc(S.cars[t.carId]?.reg||'')} · ${fts(t.doneTs)}</span></div></div>`).join('')}</div></div>`;
  return h;
}

function vDepts(){
  if(!isAdmin()){R.tab='more';return vMore()}
  const ds=Object.values(S.depts).sort((a,b)=>a.name.localeCompare(b.name,'bg'));
  HEAD={title:'Отдели',back:'more',plus:'editDept'};
  return `
  ${ds.length?`<div class="list">${ds.map(d=>{const nc=Object.values(S.cars).filter(c=>c.dept===d.id&&c.active!==false).length,nu=Object.values(S.users).filter(u=>u.dept===d.id&&u.active!==false).length;return `<div class="li"><div class="l"><b>${esc(d.name)}</b><span>${nc} автомобила · ${nu} потребителя</span></div><div class="r"><button class="btn sm" data-act="editDept" data-id="${d.id}">Преименувай</button></div></div>`}).join('')}</div>`:'<div class="empty">Няма отдели. Създай първия отдел, преди да добавяш автомобили.</div>'}`;
}
function vSettings(){
  if(!isAdmin()){R.tab='more';return vMore()}
  const s=S.settings;
  HEAD={title:'Настройки',back:'more'};
  return `<button class="btn primary wide" data-act="editSettings">Промени настройките</button>
  <div class="kv"><div><span>Зимна надбавка</span><b>+${s.winterPct}%</b></div><div><span>Зимни месеци</span><b>${(s.winterMonths||[]).join(', ')}</b></div><div><span>Лятна надбавка</span><b>+${s.summerPct}%</b></div><div><span>Летни месеци</span><b>${(s.summerMonths||[]).join(', ')||'—'}</b></div><div><span>Известие за срок</span><b>${s.warnDays} дни</b></div><div><span>Известие за сервиз</span><b>${fint(s.serviceWarnKm)} км</b></div><div><span>Периодична проверка на</span><b>${s.pressureDays} дни</b></div></div>
  <p class="small muted">Зимната норма = основна норма × (1 + надбавка). Пример: 7.5 × 1.10 = 8.25 л/100 км. Всеки автомобил може да има своя зимна надбавка.</p>`;
}

<script>
/* ============ forms ============ */
function carField(carId,onlyActive=true,filterFn){
  let cars=scopeCars().filter(c=>!onlyActive||c.active!==false);if(filterFn)cars=cars.filter(filterFn);
  if(!cars.length)fail('Няма достъпни автомобили.');
  const v=carId&&cars.some(c=>c.id===carId)?carId:cars[0].id;
  if(cars.length===1)return{html:`<input type="hidden" name="car" id="f_car" value="${v}">${sheetCar(cars[0])}`,id:v};
  return{html:fld('Автомобил',sel('car',cars.map(c=>[c.id,`${c.reg} · ${carName(c)}`]),v)),id:v};
}
function driverField(car,val){
  if(!isStaff())return `<input type="hidden" name="driver" value="${meId}">`;
  const us=Object.values(S.users).filter(u=>u.active!==false&&(u.role==='admin'||u.dept===car?.dept||u.id===val||u.id===meId)).sort((a,b)=>a.name.localeCompare(b.name,'bg'));
  return fld('Шофьор',sel('driver',us.map(u=>[u.id,`${u.name} (${ROLES[u.role]})`]),val||car?.session?.userId||(isDrv(car,meId)?meId:drvIds(car)[0])||meId),'Въвел данните: '+esc(me().name));
}
function guard(fn){return(...a)=>{try{return fn(...a)}catch(e){toast(e.message)}}}
function onCarChange(form,cb){const s=form.querySelector('#f_car');if(s&&s.tagName==='SELECT')s.addEventListener('change',()=>cb(S.cars[s.value]))}

const openTrip=guard((carId,morning)=>{
  const cf=carField(carId),car=S.cars[cf.id];
  const kmBox=`<div class="calc" id="kmCalc"></div><div class="note" id="kmWarn" hidden></div>`;
  const html=cf.html+
    (morning?`${fld('Начален километраж днес',`<div class="mk-row">${ninp('endKm','','required placeholder="напр. '+((car.odo||0)>=100000?fint(car.odo+50):'123 456')+'"')}<button type="submit" class="btn go">✓ Потвърди</button></div>`,'Километражът сутрин, преди да тръгнеш. Изминатите км за предния ден се смятат сами.')}<input type="hidden" name="startKm" id="f_startKm" value="${car.odo||0}">`+kmBox:'')+
    `<div id="dz">${driverField(car)}</div>`+
    `${fld('Дата',inp('date',today(),'date'))}<input type="hidden" name="time" value="${nowTime()}">${fld('Вид път',sel('road',Object.entries(ROADS),'mixed'))}`+
    (morning?'':`<div class="grid2">${fld('Начален км',ninp('startKm',car.odo||''))}${fld('Краен км',ninp('endKm',''))}</div>`+kmBox)+
    (morning?`<fieldset><legend>Маршрут (по желание)</legend>`:'')+
    `<div class="grid2">${fld('От',inp('from','','text','placeholder="Варна"'))}${fld('До',inp('to','','text','placeholder="Добрич"'))}</div>${fld('Маршрут',inp('route','','text','placeholder="Варна – Аксаково – Добрич"'))}${fld('Цел на пътуването',inp('purpose','','text','placeholder="Доставка на стока"'))}`+
    (morning?'</fieldset>':'')+fld('Бележка',ta('note'));
  openSheet(morning?'Сутрешен километраж':'Пътен запис',html,async f=>{
    const c=S.cars[f.car];const s=num(f.startKm),e=num(f.endKm);
    if(e==null||isNaN(e))fail('Въведи краен километраж.');
    if(s==null||isNaN(s))fail('Въведи начален километраж.');
    if(s<(c.odo||0))fail(`Километражът не може да намалява. Последен запис: ${fint(c.odo)} км.`);
    if(e<s)fail(`Крайният километраж (${fint(e)}) е по-малък от началния (${fint(s)}).`);
    if(morning&&entries().some(x=>x.carId===c.id&&x.t==='trip'&&x.morning&&!x.virtual&&x.date===f.date))fail('За тази дата вече има начален километраж. Ако е грешен, помоли мениджъра или администратора да го изтрие.');
    if(c.session&&c.session.userId!==f.driver)fail(`Автомобилът е поет временно от ${uname(c.session.userId)}. Първо приключи временното управление.`);
    await addEntry(c.id,{t:'trip',date:f.date,time:f.time,driver:f.driver,road:f.road,from:f.from.trim(),to:f.to.trim(),route:f.route.trim(),purpose:f.purpose.trim(),note:f.note.trim(),startKm:s,endKm:e,km:e-s,morning:!!morning});
    if(e>(c.odo||0))await carUpdate(c.id,{odo:e});
    toast(morning?`Записан начален километраж: ${fint(e)} км`:`Записано: ${fint(e-s)} км`);
  },'Запиши');
  const form=$('#sheetForm');
  const upd=()=>{const c=S.cars[form.car.value];const s=num(form.startKm.value),e=num(form.endKm.value);
    const calc=$('#kmCalc'),w=$('#kmWarn');
    if(morning){form.startKm.value=c.odo||0}
    if(morning){const pm=entries().filter(x=>x.carId===c.id&&x.t==='trip'&&x.morning&&!x.virtual).pop();
      calc.innerHTML=`<div><span class="cemo">📍</span>Предишен начален: <span class="num">${pm?fint(pm.reading)+' км':'—'}</span>${pm?' <small>('+fd(pm.date)+')</small>':''}</div>`+(pm&&e!=null&&!isNaN(e)&&e>=pm.reading?`<div class="cgo"><span class="cemo">✅</span>Изминати на ${fds(pm.date)}: <span class="num">${fint(e-pm.reading)} км</span></div>`:'');}
    else calc.innerHTML=`Предишен запис: <span class="num">${fint(c.odo)} км</span>`+(e!=null&&!isNaN(e)&&s!=null?` · Изминати: <span class="num">${fint(e-s)} км</span>`:'');
    w.hidden=true;
    if(s!=null&&!isNaN(s)&&s<(c.odo||0)){w.textContent=`Началният км е под последния запис (${fint(c.odo)} км) – записът ще бъде отказан.`;w.hidden=false}
    else if(!morning&&s!=null&&s>(c.odo||0)){w.textContent=`Пропуск от ${fint(s-(c.odo||0))} км спрямо последния запис.`;w.hidden=false}
    else if(e!=null&&s!=null&&e<s){w.textContent='Крайният километраж е по-малък от началния.';w.hidden=false}};
  form.addEventListener('input',upd);
  onCarChange(form,c=>{if(!morning)form.startKm.value=c.odo||'';$('#dz').innerHTML=driverField(c);upd()});
  upd();
});

const ftToggle=c=>isBi(c)?`<div class="fld"><span class="lbl">Какво зареждаш?</span><div class="ftsw"><input type="radio" name="ft" id="ft_gas" value="gas" checked><label for="ft_gas">${gasName(c)}</label><input type="radio" name="ft" id="ft_petrol" value="petrol"><label for="ft_petrol">Бензин</label></div></div>`:'';
const openFuel=guard(carId=>{
  const cf=carField(carId),car=S.cars[cf.id];
  const html=cf.html+`<div id="dz">${driverField(car)}</div>
  <div class="grid2">${fld('Дата',inp('date',today(),'date'))}${fld('Час',inp('time',nowTime(),'time'))}</div>
  ${fld('Километраж',ninp('km',car.odo||''))}
  <div id="ftz">${ftToggle(car)}</div>
  <div class="grid2">${fld('Литри',ninp('liters','','placeholder="42.50"'))}${fld('Обща сума, €',ninp('sum','','placeholder="68.00"'))}</div>
  <div class="calc" id="pplCalc">Цена/литър: —</div>
  ${fld('Бензиностанция',inp('station','','text','placeholder="OMV" list="stations"'))}<datalist id="stations">${['OMV','Shell','Lukoil','Petrol','EKO','Rompetrol','Gazprom'].map(s=>`<option value="${s}">`).join('')}</datalist>
  ${fld('Бележка',ta('note'))}`;
  openSheet('⛽ Зареждане',html,async f=>{
    const c=S.cars[f.car],km=num(f.km),l=num(f.liters),s=num(f.sum);
    if(!l||isNaN(l)||l<=0)fail('Въведи литрите.');
    if(!s||isNaN(s)||s<=0)fail('Въведи общата сума.');
    if(km==null||isNaN(km))fail('Въведи километража.');
    if(c.tankCap&&l>+c.tankCap*1.05)fail(`Литрите (${fnum(l)}) са повече от резервоара (${fint(c.tankCap)} л).`);
    const lf=lastOf(c.id,'fuel');if(lf&&km<lf.km)fail(`Километражът е по-малък от предишното зареждане (${fint(lf.km)} км).`);
    await addEntry(c.id,{t:'fuel',...(isBi(c)?{ft:f.ft==='petrol'?'petrol':'gas'}:{}),date:f.date,time:f.time,driver:f.driver,km,liters:l,sum:s,ppl:+(s/l).toFixed(3),station:f.station.trim(),note:f.note.trim()});
    toast(`Зареждането е записано: ${fnum(l)} л${isBi(c)?' '+(f.ft==='petrol'?'бензин':gasName(c).toLowerCase()):''}`);
  },'Запиши зареждане');
  const form=$('#sheetForm');
  const upd=()=>{const l=num(form.liters.value),s=num(form.sum.value);$('#pplCalc').innerHTML=`Цена/литър: <span class="num">${l&&s&&!isNaN(l)&&!isNaN(s)?eur(s/l):'—'}</span>${l&&s?` <span class="small">(${eur(s)} ÷ ${fnum(l)} л)</span>`:''}`};
  form.addEventListener('input',upd);
  onCarChange(form,c=>{form.km.value=c.odo||'';$('#dz').innerHTML=driverField(c);$('#ftz').innerHTML=ftToggle(c)});
});

function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{let d='';for(const mx of [800,640,480,360]){let w=img.width,h=img.height;if(w>h&&w>mx){h=h*mx/w;w=mx}else if(h>mx){w=w*mx/h;h=mx}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    let q=.7;d=cv.toDataURL('image/jpeg',q);while(d.length>38000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}if(d.length<=38000)break}
    URL.revokeObjectURL(url);if(d.length>38000)rej(new Error('Снимката е твърде голяма.'));else res(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Снимката не може да бъде прочетена. Опитай с JPG или PNG.'))};img.src=url})}

const openProblem=guard(carId=>{
  const cf=carField(carId),car=S.cars[cf.id];
  openSheet('Сигнал за проблем',cf.html+`<div class="grid2">${fld('Дата',inp('date',today(),'date'))}${fld('Километраж',ninp('km',car.odo||''))}</div>
  <div class="grid2">${fld('Категория',sel('cat',PCATS.map(x=>[x,x]),'Ходова част'))}${fld('Приоритет',sel('priority',Object.entries(PRIO),'mid'))}</div>
  ${fld('Проблем',inp('desc','','text','placeholder="Шум от предно колело" required'))}
  ${fld('Описание',ta('info'),'Напр. „Шум от 40 до 100 км/ч.“')}
  ${fld('Снимка (по желание)','<input type="file" id="f_photo" name="photo" accept="image/*">')}`,async f=>{
    if(!f.desc.trim())fail('Опиши накратко проблема.');
    let photo=null;if(f.photo&&f.photo[0])photo=await compressImage(f.photo[0]);
    const id=uid();
    await withRetry(()=>db.doc('problems/'+id).set(clean({carId:f.car,date:f.date,km:num(f.km),cat:f.cat,priority:f.priority,desc:f.desc.trim(),info:f.info.trim(),photo,status:'new',by:meId,ts:new Date().toISOString(),statusHist:[]})));

function carPhotoData(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{try{const W=im.naturalWidth,H=im.naturalHeight;let sw=W,sh=W*2/3;if(sh>H){sh=H;sw=H*1.5}
    const sx=(W-sw)/2,sy=(H-sh)*0.35;const cv=document.createElement('canvas');cv.width=480;cv.height=320;
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,480,320);g.imageSmoothingQuality='high';g.drawImage(im,sx,sy,sw,sh,0,0,480,320);
    let q=.78,d=cv.toDataURL('image/jpeg',q);while(d.length>38000&&q>.3){q-=.08;d=cv.toDataURL('image/jpeg',q)}
    if(d.length>38000){cv.width=360;cv.height=240;cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,360,240);d=cv.toDataURL('image/jpeg',.6)}
    URL.revokeObjectURL(url);res(d)}catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}

    return `<tr class="f">${td(i,1)}${td(fd(e.date)+(e.time?' '+e.time:''))}${td(carName(c))}${td(regText(c?.reg))}${td(uname(e.driver))}${td('')}${td('')}${td('')}${td('')}${td('')}${td('Зареждане'+(ftLabel(c,e)?' ('+ftLabel(c,e).toLowerCase()+')':'')+(e.station?' – '+e.station:'')+' при '+fint(e.km)+' км')}${td('')}${td(fnum(e.liters),1)}${td(fnum(e.ppl,3),1)}${td(fnum(e.sum),1)}${td('')}${td('')}${td('')}${td('')}${td(e.note)}</tr>`}).join('');
  const ec=a.econ;
  const foot=`<tr class="t"><td colspan="7">Общо</td>${td(fint(a.km),1)}<td colspan="4"></td>${td(fnum(a.fuelL),1)}${td(a.avgPrice==null?'':fnum(a.avgPrice,3),1)}${td(fnum(a.fuelCost),1)}${td(fnum(a.normRate),1)}${td(fnum(a.normL),1)}${td(a.actual==null?'':fnum(a.actual),1)}${td(ec==null?'':(ec>=0?'+':'')+fnum(ec),1)}<td></td></tr>`;
  const sum=[['Общо километри',fint(a.km)+' км'],['Общо гориво (заредено)',fnum(a.fuelL)+' л'],['Нормативно гориво',fnum(a.normL)+' л'],['Фактическо гориво',fnum(a.fuelL)+' л'],
    ['Икономия',ec!=null&&ec>=0?fnum(ec)+' л ('+eur(a.econEur)+')':'—'],['Преразход',ec!=null&&ec<0?fnum(-ec)+' л ('+eur(Math.abs(a.econEur||0))+')':'—'],
    ['Среден разход',a.actual==null?'—':fnum(a.actual)+' л/100 км'],['Средна цена на литър',a.avgPrice==null?'—':eur(a.avgPrice)],['Обща сума за гориво',eur(a.fuelCost)],['Сервизни разходи',eur(a.service)],['Други разходи',eur(a.other)]];
  const head=['№','Дата','Автомобил','Рег. №','Шофьор','Начален км','Краен км','Изминати км','От','До','Маршрут','Цел','Литри','Цена/л','Сума €','Норма л/100','Нормативни л','Факт. разход л/100','Икономия / преразход л','Бележка'];
  return `\x3chtml>\x3chead>\x3cmeta charset="utf-8">\x3cstyle>
  body{font-family:Arial,sans-serif;font-size:8px;color:#111;margin:14px}
  h1{font-size:15px;margin:0 0 2px} .sub{font-size:10px;color:#444;margin-bottom:10px}
  table{border-collapse:collapse;width:100%} th,td{border:1px solid #999;padding:2px 3px;vertical-align:top}
  th{background:#0E2748;color:#fff;font-size:7px} td.r{text-align:right} tr.f td{background:#EEF3FB} tr.t td{font-weight:bold;background:#E5E9EF}
  .sum{width:auto;margin-bottom:12px;font-size:10px} .sum td{padding:3px 8px} .sum td:first-child{background:#F3F5F8;font-weight:bold}
  .sign{margin-top:24px;font-size:10px} .sign span{display:inline-block;width:45%}
  \x3c/style>\x3c/head>\x3cbody><h1>${esc(sc.title)}</h1><div class="sub">${esc(sc.sub||'')} · Изготвено: ${fts(new Date().toISOString())} от ${esc(me().name)}</div>
  <table class="sum">${sum.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${esc(v)}</td></tr>`).join('')}</table>
  <table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body||'<tr><td colspan="20">Няма записи за периода.</td></tr>'}</tbody><tfoot>${foot}</tfoot></table>
  <div class="sign"><span>Шофьор: ....................................</span><span>Проверил: ....................................</span></div>\x3c/body>\x3c/html>`;
}

};
document.addEventListener('scroll',e=>{const r=e.target;if(!r||(r.id!=='heroRail'&&r.id!=='listRail'))return;clearTimeout(r._t);
  r._t=setTimeout(()=>{const sl=[...r.children],mid=r.scrollLeft+r.clientWidth/2;let best=sl[0];for(const x of sl)if(Math.abs(x.offsetLeft+x.clientWidth/2-mid)<Math.abs(best.offsetLeft+best.clientWidth/2-mid))best=x;
    const k=r.id==='listRail'?'listCar':'carId';if(best&&best.dataset.id!==R[k]){R[k]=best.dataset.id;render()}},140)},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('#sheet'))return;
  if(t.dataset.bind){R[t.dataset.bind]=t.value;if(t.dataset.bind==='repMonth'&&t.value){R.repFrom=t.value+'-01';R.repTo=monthEnd(t.value)}render()}
  if(t.dataset.bindCheck){R[t.dataset.bindCheck]=t.checked;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){R.q=t.value;clearTimeout(ACT._q);ACT._q=setTimeout(()=>{render();const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ============ Google Apps Script bridge ============ */
async function gs(fn,...args){
  let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args}),redirect:'follow'})}catch(e){throw new Error('Няма връзка със сървъра. Провери интернета и опитай отново.')}
  let j;try{j=await r.json()}catch(e){throw new Error('Сървърът не отговори правилно. Опитай след малко.')}
  if(j.err)throw new Error(j.err);return j.ok;
}
function mapErr(e){const m=String(e&&e.message||e||'').replace(/^(Exception|Error):\s*/,'');
  if(m.includes('AUTH')){logoutLocal();return new Error('Сесията изтече. Влез отново.')}
  return new Error(m||'Връзката със сървъра прекъсна. Опитай отново.')}
const LISTEN={};let CACHE=null;
let saveT=0;
function applyData(d){
  CACHE=d;if(d.me)meId=d.me;
  clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('pk_cache',JSON.stringify({t:TOKEN,d:CACHE}))}catch(e){}},800);
  S.notif=d.notif||{};S.messages=Object.fromEntries(Object.entries(d.messages||{}).map(([k,v])=>[k,{...v,id:k}]));
  for(const c of ['users','depts','cars','logs','problems','tasks']){const m=d[c]||{};
    const docs=Object.entries(m).map(([id,v])=>({id,exists:true,data:()=>v,metadata:{fromCache:false}}));
    const snap={docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}};(LISTEN[c]||[]).forEach(f=>f(snap))}
  (LISTEN['meta/settings']||[]).forEach(f=>f({id:'settings',exists:!!d.settings,data:()=>d.settings,metadata:{fromCache:false}}));
}
function mergeDeep(a,b){const o=Object.assign({},a||{});for(const k of Object.keys(b||{})){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?mergeDeep(o[k],v):v}return o}
function localApply(ops){
  const d=CACHE||{};
  for(const op of ops){const[c,id]=op.path.split('/');const set=op.op==='set';
    if(c==='logs'){const i=id.lastIndexOf('_');d.logs=d.logs||{};const ex=d.logs[id]||{carId:id.slice(0,i),month:id.slice(i+1),e:{}};const nd=set?op.data:mergeDeep(ex,op.data);nd.carId=nd.carId||ex.carId;nd.month=nd.month||ex.month;d.logs[id]=nd}
    else if(c==='meta')d.settings=set?op.data:mergeDeep(d.settings,op.data);
    else if(c==='notif'){if(id===meId)d.notif=set?op.data:mergeDeep(d.notif,op.data)}
    else{d[c]=d[c]||{};const v=set?Object.assign({},op.data):mergeDeep(d[c][id],op.data);if(c==='users'){delete v.salt;delete v.hash}d[c][id]=v}}
  applyData(d);
}
async function apiWrite(ops){
  for(const op of ops){if(op.path.startsWith('logs/')&&op.data&&op.data.e){const ex=(CACHE&&CACHE.logs&&CACHE.logs[op.path.slice(5)])||{e:{}};if(Object.keys(op.data.e).every(k=>!(ex.e||{})[k]))op.isNew=true}}
  try{await gs('write',TOKEN,ops)}catch(e){throw mapErr(e)}
  localApply(ops);
}
const gasDb={
  doc(path){return{
    get:async()=>{const[c,id]=path.split('/');const v=c==='meta'?CACHE?.settings:CACHE?.[c]?.[id];return{id,exists:!!v,data:()=>v}},
    set:d=>apiWrite([{op:'set',path,data:clean(d)}]),
    update:d=>apiWrite([{op:'update',path,data:clean(d)}]),
    onSnapshot(fn){(LISTEN[path]=LISTEN[path]||[]).push(fn);return()=>{}}}},
  collection(c){return{doc:id=>gasDb.doc(c+'/'+id),onSnapshot(fn){(LISTEN[c]=LISTEN[c]||[]).push(fn);return()=>{}}}}
};
function logoutLocal(){TOKEN=null;meId=null;try{localStorage.removeItem('pk_token');localStorage.removeItem('pk_cache')}catch(e){}
  for(const c of ['users','depts','cars','logs','problems','tasks'])S[c]={};S.loaded.clear();invalidate();R.tab='home';closeSheet();showLogin()}
async function refresh(){if(!TOKEN)return;try{const d=await gs('getAll',TOKEN);if(CACHE&&JSON.stringify(d)===JSON.stringify(CACHE))return;applyData(d)}catch(e){const m=mapErr(e);if(TOKEN)toast(m.message)}}
setInterval(()=>{if(TOKEN&&document.visibilityState==='visible'&&$('#sheet').hidden)refresh()},45000);
/* само обновяване: при всяка промяна вдигай APP_VER */
const APP_VER='30';let _verAt=0;
async function checkUpdate(){
  if(location.protocol==='file:'||Date.now()-_verAt<60000)return;_verAt=Date.now();
  try{const t=await(await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){const go=()=>location.replace(location.pathname+'?v='+m[1]+'&t='+Date.now());
      if($('#sheet').hidden)go();else{const w=setInterval(()=>{if($('#sheet').hidden){clearInterval(w);go()}},2000)}}}catch(e){}
}
setTimeout(checkUpdate,2000);setInterval(checkUpdate,10*60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TOKEN)refresh()});

function openUserLink(id){
  const u=S.users[id];if(!u)return;
  const url=APP_URL+'?u='+encodeURIComponent(u.username);
  const cars=Object.values(S.cars).filter(c=>isDrv(c,u.id)&&c.active!==false);
  const build=pw=>`Здравей, ${u.name.split(' ')[0]}! Това е линкът за електронната пътна книжка:\n${url}\n\nПотребител: ${u.username}\nПарола: ${pw||''}`;
  openSheet('Линк за вход',`<div class="row" style="flex-wrap:nowrap">${avatar(u)}<div class="sec" style="gap:2px"><b>${esc(u.name)}</b><span class="small muted">${esc(u.username)} · ${ROLES[u.role]}</span></div></div>
  ${cars.length?`<div class="tip">След вход вижда директно: ${cars.map(c=>esc(carName(c)+' '+regText(c.reg))).join(', ')}</div>`:(u.role==='driver'?`<div class="note">Няма назначен автомобил. Задай го от автомобила → Редактирай → Постоянен шофьор.</div>`:'')}
  ${fld('Парола',`<input id="f_pw" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Напиши паролата на шофьора">`,'Паролата се добавя автоматично в съобщението.')}
  ${fld('Съобщение за изпращане','<textarea id="f_msg" rows="6">'+esc(build(''))+'</textarea>','Можеш да промениш текста, ако искаш.')}
  <button type="button" class="btn primary wide" data-act="copyText">Копирай съобщението</button>
  <div class="grid2"><a class="btn" id="lnkViber" href="#" target="_blank" rel="noopener">Viber</a><a class="btn" id="lnkSms" href="#" target="_blank" rel="noopener">SMS</a></div>`,null);
  const pw=$('#f_pw'),msg=$('#f_msg');
  const links=()=>{const t=encodeURIComponent(msg.value);$('#lnkViber').href='viber://forward?text='+t;$('#lnkSms').href='sms:?&body='+t};
  pw.addEventListener('input',()=>{msg.value=build(pw.value.trim());links()});
  msg.addEventListener('input',links);links();
}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('#loginErr'),btn=e.currentTarget.querySelector('button[type=submit]');err.hidden=true;btn.disabled=true;btn.textContent='Влизане…';
  try{const r=await gs('login',$('#lu').value.trim(),$('#lp').value);
    TOKEN=r.token;try{localStorage.setItem('pk_token',TOKEN)}catch(x){}
    $('#lp').value='';R.tab='home';applyData(r.data);render();
  }catch(x){err.textContent=mapErr(x).message;err.hidden=false}
  finally{btn.disabled=false;btn.textContent='Вход'}
});

/* ============ boot ============ */
(async()=>{
  db=gasDb;dl=true;
  for(const c of ['users','depts','cars','logs','problems','tasks']){
    db.collection(c).onSnapshot(snap=>{const m={};for(const d of snap.docs)m[d.id]={...d.data(),id:d.id};S[c]=m;S.loaded.add(c);if(c==='logs')invalidate();schedule()});
  }
  db.doc('meta/settings').onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};schedule()});
  if(PREFILL)$('#lu').value=PREFILL;
  let local=null;try{local=JSON.parse(localStorage.getItem('pk_cache')||'null')}catch(e){}
  if(TOKEN&&local&&local.t===TOKEN&&local.d&&local.d.me){
    applyData(local.d);render();
    gs('getAll',TOKEN).then(d=>{applyData(d)}).catch(e=>{const m=String(e&&e.message||e);if(/AUTH/.test(m)){logoutLocal();toast('Сесията изтече. Влез отново.')}});
  }
  else if(TOKEN){
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),45000));
    try{applyData(await Promise.race([gs('getAll',TOKEN),timeout]));render()}
    catch(e){const m=String(e&&e.message||e);logoutLocal();if(!/AUTH/.test(m)){const er=$('#loginErr');er.textContent=m==='TIMEOUT'?'Сървърът не отговори навреме. Влез отново.':'Грешка от сървъра: '+m.replace(/^(Exception|Error):\s*/,'');er.hidden=false}}
  }
  else showLogin();
  if(PREFILL&&!TOKEN)setTimeout(()=>$('#lp').focus(),100);
})();
